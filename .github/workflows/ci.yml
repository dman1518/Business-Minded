name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # A real DATABASE_URL is not required for lint/typecheck/tests/build —
    # Prisma Client only needs `prisma generate` (schema-only) to produce
    # types; no database connection is made during this workflow.
    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/business_minded"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Business Minded configuration
        run: npm run validate:config

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
