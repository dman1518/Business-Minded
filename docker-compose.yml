version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: business-minded-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: businessminded
      POSTGRES_PASSWORD: businessminded
      POSTGRES_DB: businessminded
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U businessminded"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: business-minded-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://businessminded:businessminded@db:5432/businessminded?schema=public
    ports:
      - "3000:3000"

volumes:
  db-data:
